[project]
name = "ploopy-tools"
version = "0.1.0"
description = "Runtime configuration tools for Eli's Ploopy A+"
requires-python = ">=3.12"
dependencies = ["hidapi", "tomlkit", "jinja2"]

[project.scripts]
ploopy = "ploopy_tools.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ploopy_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
