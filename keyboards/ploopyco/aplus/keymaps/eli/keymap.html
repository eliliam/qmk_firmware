<!doctype html>
<!--
  Eli's Ploopy A+ keymap reference. Open this file in a browser; it prints to
  one landscape page per two panels.

  TO UPDATE (agents): edit only the KEYMAP JSON block below, then bump
  "updated". The drawing is generated from it. Keep it in sync with keymap.c
  (the LAYOUT() order is TLL, TL, TR, TRR, BL, BR, LW, RW).

  Panel kinds:
    "buttons" - labels every control. Each key in "keys" is one of
                TLL TL TR TRR BL BR (buttons) or LW RW (wheels).
                Buttons: {label, detail?, accent?}
                Wheels:  {turn, turnDetail?, press, pressDetail?, accent?}
                Use "\n" in any string to break lines; omit a key to show it blank.
                "accent" colours the label (use for layer switches / special keys).
    "motion"  - ball-motion actions: {up, down, left, right} as {label, detail?},
                plus "instructions" text.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ploopy A+ Keymap</title>
<script type="application/json" id="KEYMAP">
{
  "device": "Ploopy A+",
  "firmware": "ploopyco/aplus/rev2_001, keymap eli (branch eli-aplus)",
  "updated": "2026-10-20",
  "panels": [
    {
      "kind": "buttons",
      "title": "Base Layer",
      "subtitle": "Navigation",
      "color": "#2f6fed",
      "led": "LEDs blue",
      "keys": {
        "TLL": { "label": "Back", "detail": "Button 4" },
        "TL":  { "label": "Forward", "detail": "Button 5" },
        "TR":  { "label": "Dictation", "detail": "Ctrl+Shift+Alt+Space\nVoxtype push-to-talk" },
        "TRR": { "label": "Right\nClick" },
        "BL":  { "label": "Left\nClick", "detail": "Hold while plugging in:\nbootloader (wipes settings)" },
        "BR":  { "label": "Middle Click\nor Drag Scroll", "detail": "Button 3, or hold + move ball\nto scroll (set on Control layer)" },
        "LW":  { "turn": "Vertical Scroll", "turnDetail": "Clockwise = up", "press": "Niri Navigation", "pressDetail": "Hold + move ball (see Niri panel)\nTap: toggle overview", "accent": "#d9a400" },
        "RW":  { "turn": "Horizontal Scroll", "turnDetail": "Clockwise = right", "press": "Control Layer", "pressDetail": "Toggles on", "accent": "#e0252b" }
      }
    },
    {
      "kind": "motion",
      "title": "Niri Navigation",
      "subtitle": "Hold left wheel",
      "color": "#d9a400",
      "led": "LEDs yellow while held",
      "up":    { "label": "Workspace Up", "detail": "Hyper+Up" },
      "down":  { "label": "Workspace Down", "detail": "Hyper+Down" },
      "left":  { "label": "Column Left", "detail": "Hyper+Left" },
      "right": { "label": "Column Right", "detail": "Hyper+Right" },
      "instructions": "Hold the left wheel and roll the ball. Each 200 counts on the dominant axis is one step. The first step opens the overview and releasing closes it. A quick tap (under 250 ms, no movement) toggles the overview instead. The pointer doesn't move while held."
    },
    {
      "kind": "buttons",
      "title": "Control Layer",
      "subtitle": "Press right wheel",
      "color": "#e0252b",
      "led": "LEDs red",
      "keys": {
        "TLL": { "label": "Cycle DPI", "detail": "600 / 900 / 1200 / 1600 / 2400\nBlinks 1-5 times (default 900)" },
        "TL":  { "label": "LED\nBrightness", "detail": "Cycles 25-100%" },
        "TR":  { "label": "Vertical\nScroll Type", "detail": "Scroll ↔ Up/Down arrows\n1 blink arrows, 2 scroll" },
        "TRR": { "label": "Horizontal\nScroll Type", "detail": "Scroll ↔ Left/Right arrows\n1 blink arrows, 2 scroll" },
        "BL":  { "label": "Bootloader", "detail": "Keeps settings\nUse this to reflash", "accent": "#e0252b" },
        "BR":  { "label": "Bottom Right:\nMiddle ↔ Drag", "detail": "1 blink drag scroll (hold)\n2 blinks middle click" },
        "LW":  { "turn": "Volume", "press": "Base Layer", "accent": "#2f6fed" },
        "RW":  { "turn": "Volume", "press": "Base Layer", "accent": "#2f6fed" }
      }
    }
  ],
  "footer": "Blinks confirm a setting change. Settings are saved and survive unplugging."
}
</script>
<style>
  :root {
    --bg: #f4f4f1; --card: #ffffff; --ink: #111; --muted: #666; --line: #444;
    --body: #fafafa; --btn: #ffffff; --stroke: #555; --faint: #c8c8c8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --card: #1e1e1e; --ink: #eee; --muted: #9a9a9a; --line: #aaa;
      --body: #262626; --btn: #2d2d2d; --stroke: #aaa; --faint: #444;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414; --card: #1e1e1e; --ink: #eee; --muted: #9a9a9a; --line: #aaa;
    --body: #262626; --btn: #2d2d2d; --stroke: #aaa; --faint: #444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; margin-bottom: 12px; }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p, footer { margin: 0; color: var(--muted); font-size: .85rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: 16px; }
  .panel { background: var(--card); border-radius: 12px; padding: 14px 16px; border-top: 6px solid var(--c); }
  .panel h2 { margin: 0; font-size: 1.35rem; color: var(--c); }
  .panel .sub { color: var(--muted); font-size: .9rem; }
  .panel svg { width: 100%; height: auto; display: block; }
  .panel .instr { font-size: .85rem; color: var(--muted); margin: 4px 0 0; line-height: 1.4; }
  svg text { fill: var(--ink); font-family: inherit; }
  svg .lbl { font-weight: 700; font-size: 17px; }
  svg .det { fill: var(--muted); font-size: 11.5px; }
  svg .lead { stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 2 3; fill: none; }
  svg .body { fill: var(--body); stroke: var(--stroke); stroke-width: 2.5; }
  svg .btn { fill: var(--btn); stroke: var(--stroke); stroke-width: 2; }
  svg .faint { fill: none; stroke: var(--faint); stroke-width: 2; }
  footer { margin-top: 12px; }
  @media print {
    :root { --bg: #fff; --card: #fff; }
    main { max-width: none; padding: 0; }
    .grid { grid-template-columns: 1fr 1fr; }
    .panel { break-inside: avoid; border: 1px solid #ccc; }
    @page { size: landscape; margin: 10mm; }
  }
</style>
</head>
<body>
<main>
  <header><h1 id="title"></h1><p id="meta"></p></header>
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</main>
<script>
const K = JSON.parse(document.getElementById('KEYMAP').textContent);
const NS = 'http://www.w3.org/2000/svg';
const W = 640, H = 560, CX = 320;

/* Device geometry. Each button: shape rect, the point the leader line touches,
   and where its label goes. */
const BTN = {
  TLL: { r: [212, 132, 54, 96],  hit: [239, 180], at: [176, 150], anchor: 'end' },
  TL:  { r: [272, 128, 44, 42],  hit: [294, 149], at: [250, 46],  anchor: 'middle' },
  TR:  { r: [324, 128, 44, 42],  hit: [346, 149], at: [400, 46],  anchor: 'middle' },
  TRR: { r: [374, 132, 54, 96],  hit: [401, 180], at: [464, 150], anchor: 'start' },
  BL:  { r: [212, 236, 54, 70],  hit: [239, 271], at: [176, 262], anchor: 'end' },
  BR:  { r: [374, 236, 54, 70],  hit: [401, 271], at: [464, 262], anchor: 'start' },
};
const WHEEL = {
  LW: { c: [292, 342], at: [270, 410], anchor: 'end' },
  RW: { c: [348, 342], at: [370, 410], anchor: 'start' },
};
const BALL = { c: [CX, 210], r: 50 };

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
/* Multi-line text; returns the y after the last line. */
function text(svg, s, x, y, anchor, cls, lh, fill) {
  const lines = String(s).split('\n');
  lines.forEach((ln, i) => {
    const t = el('text', { x, y: y + i * lh, 'text-anchor': anchor, class: cls }, svg);
    if (fill) t.style.fill = fill;
    t.textContent = ln;
  });
  return y + lines.length * lh;
}
function block(svg, x, y, anchor, label, detail, accent) {
  let ny = text(svg, label, x, y, anchor, 'lbl', 19, accent);
  if (detail) ny = text(svg, detail, x, ny, anchor, 'det', 14);
  return ny;
}

function device(svg, color, faint) {
  const cls = faint ? 'faint' : null;
  el('rect', { x: 196, y: 116, width: 248, height: 262, rx: 54, class: cls || 'body' }, svg);
  for (const b of Object.values(BTN)) {
    const [x, y, w, h] = b.r;
    el('rect', { x, y, width: w, height: h, rx: 12, class: cls || 'btn' }, svg);
  }
  for (const w of Object.values(WHEEL)) el('circle', { cx: w.c[0], cy: w.c[1], r: 26, class: cls || 'btn' }, svg);
  el('circle', { cx: BALL.c[0], cy: BALL.c[1], r: BALL.r, fill: 'none', stroke: color, 'stroke-width': 9 }, svg);
}

function buttonsPanel(svg, p) {
  device(svg, p.color, false);
  for (const [id, g] of Object.entries(BTN)) {
    const k = p.keys[id]; if (!k) continue;
    const [lx, ly] = g.at;
    const lineStart = g.anchor === 'end' ? [lx + 6, ly - 5] : g.anchor === 'start' ? [lx - 6, ly - 5] : [lx, ly + 8 + 19 * (k.label.split('\n').length - 1) + 14 * (k.detail ? k.detail.split('\n').length : 0)];
    el('path', { d: `M${lineStart[0]},${lineStart[1]} L${g.hit[0]},${g.hit[1]}`, class: 'lead' }, svg);
    block(svg, lx, ly, g.anchor, k.label, k.detail, k.accent);
  }
  for (const [id, g] of Object.entries(WHEEL)) {
    const k = p.keys[id]; if (!k) continue;
    const [lx, ly] = g.at;
    el('path', { d: `M${g.c[0]},${g.c[1] + 10} L${lx + (g.anchor === 'end' ? 4 : -4)},${ly - 16}`, class: 'lead' }, svg);
    let y = text(svg, 'Turn:', lx, ly, g.anchor, 'det', 14);
    y = block(svg, lx, y + 4, g.anchor, k.turn, k.turnDetail);
    y = text(svg, 'Press:', lx, y + 6, g.anchor, 'det', 14);
    block(svg, lx, y + 4, g.anchor, k.press, k.pressDetail, k.accent);
  }
}

function motionPanel(svg, p) {
  device(svg, p.color, true);
  const [cx, cy] = BALL.c, R = BALL.r;
  el('defs', {}, svg).innerHTML =
    `<marker id="ah-${p.title.replace(/\W/g, '')}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>`;
  const mid = `url(#ah-${p.title.replace(/\W/g, '')})`;
  const arrows = {
    up:    { from: [cx, cy - R - 6],  to: [cx, cy - R - 70],  at: [cx, cy - R - 104], anchor: 'middle' },
    down:  { from: [cx, cy + R + 6],  to: [cx, cy + R + 150], at: [cx, cy + R + 180], anchor: 'middle' },
    left:  { from: [cx - R - 6, cy],  to: [cx - R - 90, cy],  at: [cx - R - 100, cy - 26], anchor: 'end' },
    right: { from: [cx + R + 6, cy],  to: [cx + R + 90, cy],  at: [cx + R + 100, cy - 26], anchor: 'start' },
  };
  for (const [dir, a] of Object.entries(arrows)) {
    const k = p[dir]; if (!k) continue;
    const ln = el('line', { x1: a.from[0], y1: a.from[1], x2: a.to[0], y2: a.to[1], stroke: 'currentColor', 'stroke-width': 9, 'marker-end': mid }, svg);
    ln.style.color = 'var(--ink)';
    block(svg, a.at[0], a.at[1], a.anchor, k.label, k.detail);
  }
  /* Mark the held wheel. */
  el('circle', { cx: WHEEL.LW.c[0], cy: WHEEL.LW.c[1], r: 26, fill: p.color, opacity: .85 }, svg);
}

document.getElementById('title').textContent = `${K.device} keymap`;
document.getElementById('meta').textContent = `${K.firmware} · updated ${K.updated}`;
document.getElementById('foot').textContent = K.footer || '';
const grid = document.getElementById('grid');
for (const p of K.panels) {
  const sec = document.createElement('section');
  sec.className = 'panel';
  sec.style.setProperty('--c', p.color);
  sec.innerHTML = `<h2></h2><div class="sub"></div>`;
  sec.querySelector('h2').textContent = p.title;
  sec.querySelector('.sub').textContent = [p.subtitle, p.led].filter(Boolean).join(' · ');
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': p.title });
  sec.appendChild(svg);
  grid.appendChild(sec); // must be in the DOM for getBBox
  (p.kind === 'motion' ? motionPanel : buttonsPanel)(svg, p);
  /* Grow the viewBox to fit the text, so longer labels never clip. */
  const b = svg.getBBox(), x0 = Math.min(0, b.x - 8), x1 = Math.max(W, b.x + b.width + 8);
  svg.setAttribute('viewBox', `${x0} ${b.y - 12} ${x1 - x0} ${b.height + 24}`);
  if (p.instructions) {
    const ins = document.createElement('p');
    ins.className = 'instr';
    ins.textContent = p.instructions;
    sec.appendChild(ins);
  }
}
</script>
</body>
</html>
